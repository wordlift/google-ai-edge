<!DOCTYPE html>
<html lang="en">
<head></head>
<body>
    <script>
        /**
         * AI Edge Gallery - WordLift GraphQL Logic Runner
         * Triggers WordLift API fetch and prepares webview parameters.
         */
        window['ai_edge_gallery_get_result'] = async (data, secret) => {
            try {
                console.log("Raw Skill Data: ", data);
                
                const queryMatch = data.match(/\[QUERY\](.*?)\[\/QUERY\]/s);
                const questionMatch = data.match(/\[QUESTION\](.*?)\[\/QUESTION\]/s);
                const summaryMatch = data.match(/\[SUMMARY\](.*?)\[\/SUMMARY\]/s);
                
                let query, question, summary;
                
                if (!data.includes("[QUERY]")) {
                    question = data.trim();
                    // v10 Tuning: Added similarity: 0.5 to filter noise and reduced rows for sharper focus.
                    query = `query { entitySearch(query: { search: { string: "${question.replace(/"/g, '\\"')}" }, similarity: 0.5 }, page:0, rows:10) { id: iri label: string(name: "rdfs:label") name: string(name: "schema:name") headline: string(name: "schema:headline") url: string(name: "schema:url") mainEntityOfPage: string(name: "schema:mainEntityOfPage") types: refs(name: "rdf:type") matchScore: float(name: "_:score") } }`;
                } else {
                    query = queryMatch ? queryMatch[1].trim() : null;
                    question = questionMatch ? questionMatch[1].trim() : "WordLift Query";
                    summary = summaryMatch ? summaryMatch[1].trim() : null;
                }

                if (!query) {
                    throw new Error("Could not construct a valid query.");
                }

                if (!secret) {
                    throw new Error("Missing WordLift API Key.");
                }

                const response = await fetch("https://api.wordlift.io/graphql", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json",
                        "Authorization": `Key ${secret}`
                    },
                    body: JSON.stringify({ query })
                });

                if (response.status === 401) {
                    throw new Error("Unauthorized (401). Your WordLift API Key is invalid.");
                }

                const result = await response.json();

                if (result.errors) {
                    return JSON.stringify({
                        error: result.errors.map(e => e.message).join("; ")
                    });
                }

                const payload = {
                    data: result.data,
                    q: question,
                    summary: summary
                };
                
                try {
                    localStorage.setItem('wl_payload', JSON.stringify(payload));
                } catch (e) {
                    console.error("Critical: LocalStorage payload save failed:", e);
                }

                const firstKey = result.data ? Object.keys(result.data)[0] : null;
                const llmSnippet = firstKey ? JSON.stringify(result.data[firstKey]?.slice(0, 5) || [], null, 2) : "[]";

                return JSON.stringify({
                    result: `DATA_FOUND: ${llmSnippet}`,
                    webview: {
                        // v=10 Relevance Tuning & Label Priority Fix
                        url: `../assets/webview.html?v=10`,
                        aspectRatio: 1.2
                    }
                });
            } catch (e) {
                console.error("WordLift Edge Skill Error:", e);
                return JSON.stringify({
                    error: `Execution failed: ${e.message}`
                });
            }
        };
    </script>
</body>
</html>
