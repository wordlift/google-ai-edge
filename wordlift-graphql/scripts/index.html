<!DOCTYPE html>
<html lang="en">
<head></head>
<body>
    <script>
        /**
         * AI Edge Gallery - WordLift GraphQL Logic Runner
         * Triggers WordLift API fetch and prepares webview parameters.
         */
        async function ai_edge_gallery_get_result(data, secret) {
            try {
                console.log("Runner Execution Started. Data length:", data?.length);
                
                const queryMatch = data.match(/\[QUERY\](.*?)\[\/QUERY\]/s);
                const questionMatch = data.match(/\[QUESTION\](.*?)\[\/QUESTION\]/s);
                const summaryMatch = data.match(/\[SUMMARY\](.*?)\[\/SUMMARY\]/s);
                
                let query, question, summary;
                
                if (!data.includes("[QUERY]")) {
                    question = data.trim();
                    // v12: Restored reliable query by removing unsupported 'similarity' argument.
                    query = `query { entitySearch(query: { search: { string: "${question.replace(/"/g, '\\"')}" } }, page:0, rows:10) { id: iri label: string(name: "rdfs:label") name: string(name: "schema:name") headline: string(name: "schema:headline") url: string(name: "schema:url") mainEntityOfPage: string(name: "schema:mainEntityOfPage") types: refs(name: "rdf:type") matchScore: float(name: "_:score") } }`;
                } else {
                    query = queryMatch ? queryMatch[1].trim() : null;
                    question = questionMatch ? questionMatch[1].trim() : "WordLift Query";
                    summary = summaryMatch ? summaryMatch[1].trim() : null;
                }

                if (!query) throw new Error("Could not construct a valid query.");
                if (!secret) throw new Error("Missing WordLift API Key.");

                const response = await fetch("https://api.wordlift.io/graphql", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json",
                        "Authorization": `Key ${secret}`
                    },
                    body: JSON.stringify({ query })
                });

                if (response.status === 401) throw new Error("Unauthorized (401). Invalid API Key.");

                const result = await response.json();
                if (result.errors) {
                    return JSON.stringify({ error: result.errors.map(e => e.message).join("; ") });
                }

                const payload = {
                    data: result.data,
                    q: question,
                    summary: summary
                };
                
                try {
                    localStorage.setItem('wl_payload', JSON.stringify(payload));
                } catch (e) {
                    console.warn("Payload save failed (likely size limit).");
                }

                const firstKey = result.data ? Object.keys(result.data)[0] : null;
                const llmSnippet = firstKey ? JSON.stringify(result.data[firstKey]?.slice(0, 5) || [], null, 2) : "[]";

                return JSON.stringify({
                    result: `DATA_FOUND: ${llmSnippet}`,
                    webview: {
                        // v=12: Search functionality restored and verified.
                        url: `../assets/webview.html?v=12`,
                        aspectRatio: 1.2
                    }
                });
            } catch (e) {
                console.error("WordLift Runner Error:", e);
                return JSON.stringify({ error: `Execution failed: ${e.message}` });
            }
        }

        // Explicit registration on window
        window.ai_edge_gallery_get_result = ai_edge_gallery_get_result;
        console.log("WordLift Runner v12 Loaded.");
    </script>
</body>
</html>
