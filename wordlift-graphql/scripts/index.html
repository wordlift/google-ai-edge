<!DOCTYPE html>
<html lang="en">

<head></head>

<body>
    <script>
        /**
         * AI Edge Gallery - WordLift GraphQL Logic Runner
         * Triggers WordLift API fetch and prepares webview parameters.
         */
        window['ai_edge_gallery_get_result'] = async (data, secret) => {
            try {
                console.log("Raw Skill Data: ", data);
                
                // --- SMART SEARCH FALLBACK ---
                // If the model sends a plain string (without tags), we treat it as 
                // a high-quality vector search for discovery.
                // --- TAGGED PROTOCOL PARSING ---
                const queryMatch = data.match(/\[QUERY\](.*?)\[\/QUERY\]/s);
                const questionMatch = data.match(/\[QUESTION\](.*?)\[\/QUESTION\]/s);
                const summaryMatch = data.match(/\[SUMMARY\](.*?)\[\/SUMMARY\]/s);
                
                let query, question, summary;
                
                if (!data.includes("[QUERY]")) {
                    question = data.trim();
                    query = `query { entitySearch(query: { search: { string: "${question.replace(/"/g, '\\"')}" } }, page:0, rows:20) { id: iri label: string(name: "rdfs:label") name: string(name: "schema:name") headline: string(name: "schema:headline") url: string(name: "schema:url") mainEntityOfPage: string(name: "schema:mainEntityOfPage") types: refs(name: "rdf:type") matchScore: float(name: "_:score") } }`;
                } else {
                    query = queryMatch ? queryMatch[1].trim() : null;
                    question = questionMatch ? questionMatch[1].trim() : "WordLift Query";
                    summary = summaryMatch ? summaryMatch[1].trim() : null;
                }

                if (!query) {
                    throw new Error("Could not construct a valid query. Please provide a search term or a tagged [QUERY].");
                }

                if (!secret) {
                    throw new Error("Missing WordLift API Key. To update your key, please DELETE the skill and re-import 'wordlift-ai-expert' via the URL to reset the secret prompt.");
                }

                const response = await fetch("https://api.wordlift.io/graphql", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json",
                        "Authorization": `Key ${secret}`
                    },
                    body: JSON.stringify({ query })
                });

                if (response.status === 401) {
                    throw new Error("Unauthorized (401). Your WordLift API Key is invalid or has expired.");
                }

                const result = await response.json();

                if (result.errors) {
                    return JSON.stringify({
                        error: result.errors.map(e => e.message).join("; ")
                    });
                }

                // Prepare results for the webview.
                const resultStr = encodeURIComponent(JSON.stringify(result.data));
                const encodedSummary = summary ? `&summary=${encodeURIComponent(summary)}` : '';

                // Also return a small snippet of data to the LLM so it can summarize it.
                const firstKey = result.data ? Object.keys(result.data)[0] : null;
                const llmSnippet = firstKey ? JSON.stringify(result.data[firstKey]?.slice(0, 5) || [], null, 2) : "[]";

                return JSON.stringify({
                    result: `DATA_FOUND: ${llmSnippet}`,
                    webview: {
                        // Added v=4 cache buster and summary support
                        url: `../assets/webview.html?v=4&data=${resultStr}&q=${encodeURIComponent(question)}${encodedSummary}`,
                        aspectRatio: 1.2
                    }
                });
            } catch (e) {
                console.error("WordLift Edge Skill Error:", e);
                return JSON.stringify({
                    error: `Execution failed: ${e.message}`
                });
            }
        };
    </script>
</body>

</html>
