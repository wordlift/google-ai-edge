<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordLift Knowledge Graph Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Theme Colors - Premium WordLift Aesthetics */
            --color-bg: #F8FAFC;
            --color-surface: #FFFFFF;
            --color-brand: #0F6E56;
            --color-brand-soft: rgba(15, 110, 86, 0.08);
            --color-text: #1E293B;
            --color-text-sub: #64748B;
            --color-border: #E2E8F0;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --font-sans: 'Inter', -apple-system, system-ui, sans-serif;
        }

        body {
            margin: 0;
            padding: 24px;
            background: var(--color-bg);
            color: var(--color-text);
            font-family: var(--font-sans);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Header Styling */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            font-weight: 700;
            font-size: 20px;
            letter-spacing: -0.02em;
            color: var(--color-text);
        }

        .status-pill {
            background: var(--color-brand-soft);
            color: var(--color-brand);
            padding: 6px 12px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-pill::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--color-brand);
            border-radius: 50%;
        }

        /* Summary Card */
        .summary-card {
            background: var(--color-surface);
            padding: 24px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow);
        }

        .summary-label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--color-brand);
            margin-bottom: 12px;
            display: block;
        }

        .summary-text {
            font-size: 15px;
            line-height: 1.6;
            color: var(--color-text);
            margin: 0;
        }

        /* Table Styling */
        .card {
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .table-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--color-border);
            background: #fff;
        }

        .table-title {
            font-weight: 600;
            font-size: 14px;
            color: var(--color-text-sub);
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: #FAFBFC;
            padding: 14px 24px;
            font-size: 11px;
            font-weight: 700;
            color: var(--color-text-sub);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--color-border);
            white-space: nowrap;
        }

        td {
            padding: 16px 24px;
            border-bottom: 1px solid var(--color-border);
            font-size: 14px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: #F8FAFC;
        }

        /* Data Type Pills */
        .pill {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
        }

        .pill-number { background: #EEF2FF; color: #4338CA; }
        .pill-string { background: #F0FDF4; color: #15803D; }
        .pill-iri { background: #FFF7ED; color: #C2410C; text-decoration: none; }

        .metric-val {
            font-family: ui-monospace, SFMono-Regular, monospace;
            font-weight: 600;
        }

        .no-data {
            padding: 64px;
            text-align: center;
            color: var(--color-text-sub);
        }

        /* Transitions */
        .summary-card, .card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        @media (max-width: 640px) {
            body { padding: 16px; }
            .header-title { font-size: 18px; }
            td, th { padding: 12px 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-title">KG Explorer v6</div>
            <div class="status-pill">Connected</div>
        </div>

        <div id="summaryCard" class="summary-card" style="display: none;">
            <span class="summary-label">Executive Summary</span>
            <p id="summaryText" class="summary-text"></p>
        </div>

        <div class="card">
            <div class="table-header">
                <div class="table-title" id="queryTitle">Results</div>
            </div>
            <div class="table-wrap">
                <table id="resultTable">
                    <thead><tr id="tableHead"></tr></thead>
                    <tbody id="tableBody"></tbody>
                </table>
                <div id="noData" class="no-data" style="display: none;">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom: 16px; opacity: 0.5;">
                        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
                    </svg>
                    <p>No entities matched your search criteria.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const rawJson = params.get('data');
        const summary = params.get('summary');
        const qTitle = params.get('q');

        if (qTitle) document.getElementById('queryTitle').innerText = qTitle;
        
        if (summary) {
            document.getElementById('summaryCard').style.display = 'block';
            document.getElementById('summaryText').innerText = decodeURIComponent(summary);
        }

        try {
            // Priority 1: URL data (for small payloads)
            // Priority 2: localStorage (for large payloads / URI Too Long fix)
            const rawJson = params.get('data') || localStorage.getItem('wl_explorer_data');
            
            if (!rawJson) throw new Error("No data found in URL or LocalStorage");
            
            const data = JSON.parse(decodeURIComponent(rawJson).startsWith('{') ? decodeURIComponent(rawJson) : rawJson);
            
            const firstKey = Object.keys(data)[0];
            const list = Array.isArray(data[firstKey]) ? data[firstKey] : (typeof data === 'object' ? [data] : null);

            if (!list || list.length === 0) {
                document.getElementById('resultTable').style.display = 'none';
                document.getElementById('noData').style.display = 'block';
            } else {
                const keys = [...new Set(list.flatMap(row => Object.keys(row)))];
                const headRow = document.getElementById('tableHead');
                keys.forEach(key => {
                    const th = document.createElement('th');
                    th.innerText = key.replace(/([A-Z])/g, ' $1').trim();
                    headRow.appendChild(th);
                });

                const tbody = document.getElementById('tableBody');
                list.forEach(row => {
                    const tr = document.createElement('tr');
                    
                    // Identify this row's display name for potential use
                    const displayName = row.label || row.headline || row.name || row.id?.split('/').pop() || '-';

                    keys.forEach(key => {
                        const td = document.createElement('td');
                        const val = row[key];
                        
                        // Smart IRI Linking (id field mapped from iri)
                        if (key === 'id' || (typeof val === 'string' && val.match(/^https?:\/\//i))) {
                             const shortVal = val.split('/').pop().substring(0, 20);
                             td.innerHTML = `<a href="${val}" target="_blank" class="pill pill-iri" title="${val}">${shortVal}...</a>`;
                        } 
                        // Number formatting
                        else if (typeof val === 'number') {
                            td.innerHTML = `<span class="metric-val pill-number">${val.toLocaleString()}</span>`;
                        } 
                        // String / Fallback
                        else {
                            td.innerHTML = `<span class="pill-string">${val || '-'}</span>`;
                        }
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                });
            }
        } catch (e) {
            console.error(e);
            document.getElementById('noData').style.display = 'block';
            document.getElementById('noData').innerText = "Parse error: " + e.message;
        }
    </script>
</body>
</html>
