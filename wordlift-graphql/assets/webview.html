<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordLift Knowledge Graph Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #F8FAFC;
            --color-surface: #FFFFFF;
            --color-brand: #0F6E56;
            --color-brand-soft: rgba(15, 110, 86, 0.08);
            --color-text: #1E293B;
            --color-text-sub: #64748B;
            --color-border: #E2E8F0;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --font-sans: 'Inter', -apple-system, system-ui, sans-serif;
        }

        body {
            margin: 0;
            padding: 24px;
            background: var(--color-bg);
            color: var(--color-text);
            font-family: var(--font-sans);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            font-weight: 700;
            font-size: 20px;
            letter-spacing: -0.02em;
            color: var(--color-text);
        }

        .status-pill {
            background: var(--color-brand-soft);
            color: var(--color-brand);
            padding: 6px 12px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-pill::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--color-brand);
            border-radius: 50%;
        }

        .summary-card {
            background: var(--color-surface);
            padding: 24px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow);
        }

        .summary-label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--color-brand);
            margin-bottom: 12px;
            display: block;
        }

        .summary-text {
            font-size: 15px;
            line-height: 1.6;
            color: var(--color-text);
            margin: 0;
        }

        .card {
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .table-header { padding: 16px 24px; border-bottom: 1px solid var(--color-border); background: #fff; }
        .table-title { font-weight: 600; font-size: 14px; color: var(--color-text-sub); }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #FAFBFC; padding: 14px 24px; font-size: 11px; font-weight: 700; color: var(--color-text-sub); text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--color-border); white-space: nowrap; }
        td { padding: 16px 24px; border-bottom: 1px solid var(--color-border); font-size: 14px; vertical-align: top; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #F8FAFC; }

        .pill { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 500; }
        .pill-number { background: #EEF2FF; color: #4338CA; }
        .pill-string { background: #F0FDF4; color: #15803D; }
        .pill-iri { background: #FFF7ED; color: #C2410C; text-decoration: none; border: 1px solid #FED7AA; }
        .pill-iri:hover { background: #FED7AA; }

        /* Type badges */
        .type-badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 100px; font-size: 11px; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; }
        .type-person { background: #EDE9FE; color: #6D28D9; }
        .type-organization { background: #DBEAFE; color: #1D4ED8; }
        .type-place { background: #D1FAE5; color: #059669; }
        .type-article { background: #FEF3C7; color: #B45309; }
        .type-creativework { background: #FCE7F3; color: #BE185D; }
        .type-event { background: #FFE4E6; color: #E11D48; }
        .type-product { background: #CCFBF1; color: #0D9488; }
        .type-other { background: #F1F5F9; color: #475569; }

        .desc-cell { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--color-text-sub); font-size: 13px; }

        .metric-val { font-family: ui-monospace, SFMono-Regular, monospace; font-weight: 600; }
        .no-data { padding: 64px; text-align: center; color: var(--color-text-sub); }

        @media (max-width: 640px) {
            body { padding: 16px; }
            .header-title { font-size: 18px; }
            td, th { padding: 12px 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-title">KG Explorer v15 · RLM-on-KG</div>
            <div class="status-pill">Connected</div>
        </div>

        <div id="summaryCard" class="summary-card" style="display: none;">
            <span class="summary-label">Executive Summary</span>
            <p id="summaryText" class="summary-text"></p>
        </div>

        <div class="card">
            <div class="table-header">
                <div class="table-title" id="queryTitle">Results</div>
            </div>
            <div class="table-wrap">
                <table id="resultTable">
                    <thead><tr id="tableHead"></tr></thead>
                    <tbody id="tableBody"></tbody>
                </table>
                <div id="noData" class="no-data" style="display: none;">
                    <p>No entities matched your search criteria.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Helpers ---
        function extractPrimaryType(typesArray) {
            if (!typesArray || !Array.isArray(typesArray) || typesArray.length === 0) return null;
            // Prefer the most specific schema.org type
            const dominated = ['http://schema.org/Thing', 'http://schema.org/CreativeWork'];
            const specific = typesArray.filter(t => !dominated.includes(t));
            const best = specific.length > 0 ? specific[0] : typesArray[0];
            // Extract short name: "http://schema.org/Person" -> "Person"
            return best.split('/').pop();
        }

        function getTypeBadgeClass(typeName) {
            if (!typeName) return 'type-other';
            const t = typeName.toLowerCase();
            if (t === 'person') return 'type-person';
            if (t === 'organization' || t === 'localbusiness') return 'type-organization';
            if (t === 'place') return 'type-place';
            if (t === 'article' || t === 'blogposting' || t === 'newsarticle') return 'type-article';
            if (t === 'creativework' || t === 'webpage' || t === 'webpagelement') return 'type-creativework';
            if (t === 'event') return 'type-event';
            if (t === 'product' || t === 'offer') return 'type-product';
            return 'type-other';
        }

        // --- Main ---
        let payload = null;
        try {
            payload = JSON.parse(localStorage.getItem('wl_payload'));
        } catch (e) {
            console.error("Payload read failed:", e);
        }

        const params = new URLSearchParams(window.location.search);
        const qTitle = payload?.q || params.get('q');
        const summary = payload?.summary || params.get('summary');

        if (qTitle) document.getElementById('queryTitle').innerText = qTitle;
        if (summary) {
            document.getElementById('summaryCard').style.display = 'block';
            document.getElementById('summaryText').innerText = decodeURIComponent(summary);
        }

        try {
            const data = payload?.data || (params.get('data') ? JSON.parse(decodeURIComponent(params.get('data'))) : null);
            if (!data) throw new Error("No data found");

            const firstKey = Object.keys(data)[0];
            const list = Array.isArray(data[firstKey]) ? data[firstKey] : (typeof data === 'object' ? [data] : null);

            if (!list || list.length === 0) {
                document.getElementById('resultTable').style.display = 'none';
                document.getElementById('noData').style.display = 'block';
            } else {
                // Build columns: Type | Entity | KG Link | Description | ...remaining
                const identityFields = ['label', 'name', 'headline'];
                const skipFields = [...identityFields, 'id', 'types', 'description'];
                let allKeys = [...new Set(list.flatMap(row => Object.keys(row)))];
                const extraKeys = allKeys.filter(k => !skipFields.includes(k));
                const finalKeys = ['_type', 'Entity', 'id', 'description', ...extraKeys];

                const headRow = document.getElementById('tableHead');
                finalKeys.forEach(key => {
                    const th = document.createElement('th');
                    if (key === '_type') th.innerText = 'Type';
                    else if (key === 'id') th.innerText = 'KG Link (IRI)';
                    else th.innerText = key.replace(/([A-Z])/g, ' $1').trim();
                    headRow.appendChild(th);
                });

                const tbody = document.getElementById('tableBody');
                list.forEach(row => {
                    const tr = document.createElement('tr');
                    finalKeys.forEach(key => {
                        const td = document.createElement('td');
                        let val = row[key];

                        if (key === '_type') {
                            const primaryType = extractPrimaryType(row.types);
                            const cls = getTypeBadgeClass(primaryType);
                            td.innerHTML = primaryType
                                ? `<span class="type-badge ${cls}">${primaryType}</span>`
                                : `<span class="type-badge type-other">Unknown</span>`;
                        }
                        else if (key === 'Entity') {
                            val = row.headline || row.name || row.label || 'Unnamed Entity';
                            td.innerHTML = `<span style="font-weight: 600; color: var(--color-brand);">${val}</span>`;
                        }
                        else if (key === 'id') {
                            if (val) {
                                const shortVal = val.split('/').pop().substring(0, 28);
                                td.innerHTML = `<a href="${val}" target="_blank" class="pill pill-iri" title="${val}">🔗 ${shortVal}…</a>`;
                            } else {
                                td.innerHTML = '-';
                            }
                        }
                        else if (key === 'description') {
                            td.className = 'desc-cell';
                            td.title = val || '';
                            td.innerText = val ? val.substring(0, 120) + (val.length > 120 ? '…' : '') : '-';
                        }
                        else if (typeof val === 'string' && val.match(/^https?:\/\//i)) {
                            const shortVal = val.split('/').pop().substring(0, 24);
                            td.innerHTML = `<a href="${val}" target="_blank" class="pill pill-iri" title="${val}">🔗 ${shortVal}…</a>`;
                        }
                        else if (typeof val === 'number') {
                            td.innerHTML = `<span class="metric-val pill-number">${val.toLocaleString()}</span>`;
                        }
                        else if (Array.isArray(val)) {
                            td.innerHTML = val.map(v => `<span class="pill pill-string" style="margin: 2px;">${String(v).split('/').pop()}</span>`).join(' ');
                        }
                        else {
                            td.innerHTML = `<span class="pill-string">${val || '-'}</span>`;
                        }
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                });
            }
        } catch (e) {
            console.error(e);
            document.getElementById('noData').style.display = 'block';
            document.getElementById('noData').innerText = "Parse error: " + e.message;
        }
    </script>
</body>
</html>
